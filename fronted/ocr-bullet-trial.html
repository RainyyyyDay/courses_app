<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>列表圆点整理试验</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#1f2937;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}
    main{max-width:1500px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0}header{margin-bottom:24px}
    .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,input{font:inherit}button{padding:8px 18px;cursor:pointer}
    .columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}section{background:white;padding:16px;border:1px solid #dde1ea;border-radius:12px}
    h2{font-size:18px;margin:0 0 10px}textarea{width:100%;min-height:520px;resize:vertical;padding:12px;font:14px/1.8 system-ui;border:1px solid #ccd3df;border-radius:6px;white-space:pre-wrap}
    .note{color:#596579;font-size:13px}#status{min-height:28px}a{color:#2457ae}@media(max-width:900px){.columns{grid-template-columns:1fr}textarea{min-height:280px}main{padding:16px}}
  </style>
</head>
<body><main>
  <header><h1>列表圆点整理试验</h1><p>同一张图片，对比原始识别、段落合并和圆点整理的效果。这里只预览，不保存到课程资料。</p>
    <p class="note">试验会统一明确的行首圆点。在至少三条连续编号、且其中已有圆点依据时，尝试补齐漏识别的圆点。独立问号、000、页码及工具栏文字保留，请人工校对。</p>
    <div class="tools"><label>选择图片或 PDF <input id="file" type="file" accept="image/*,.pdf"></label><button id="scan" type="button">识别并对比</button><a href="/">返回课程页面</a></div>
    <p id="status" role="status" aria-live="polite">请选择要测试的附件。</p>
  </header>
  <div class="columns">
    <section><h2>① 原始识别</h2><textarea id="raw" aria-label="原始识别" readonly></textarea></section>
    <section><h2>② 合并段落</h2><textarea id="smart" aria-label="合并段落" readonly></textarea></section>
    <section><h2>③ 试验：统一列表圆点</h2><textarea id="trial" aria-label="统一列表圆点" readonly></textarea></section>
  </div>
  <p class="note">正式校对面板也可在“文字排版”中选择“试验：统一列表圆点”，默认仍使用智能合并段落。</p>
</main>
<script src="js/ocrBrowser.js?v=20261026-ocr-bullets-65"></script>
<script src="js/utils.js?v=20261026-ocr-bullets-65"></script>
<script>
  document.getElementById('scan').onclick=async()=>{
    const file=document.getElementById('file').files[0],button=document.getElementById('scan'),status=document.getElementById('status');
    if(!file){status.textContent='请先选择图片或 PDF。';return}
    button.disabled=true;
    try{
      const result=await recognizeTextInBrowser(file,message=>{status.textContent=message},{interactive:true});
      const smart=result.text,raw=result.rawText??smart,trial=ocrBulletTrialText(smart);
      document.getElementById('raw').value=raw;document.getElementById('smart').value=smart;document.getElementById('trial').value=trial;
      status.textContent=trial===smart?'对比完成：未找到可确认的圆点调整。请检查三栏内容。':'对比完成：试验栏已整理圆点。请对照原图检查漏项和误改。';
    }catch(error){status.textContent=error.name==='AbortError'?'已取消，已有预览保留。':error.message}
    finally{button.disabled=false}
  };
</script>
</body></html>
